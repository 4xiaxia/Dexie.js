# Dexie.js Workflow Update Npm Dependencies Multi Package

## Action

Follow the update-npm-dependencies-multi-package workflow:
1. Identify outdated dependencies in each package (using tools like npm outdated, pnpm, or dependabot).
2. Update the version numbers in package.json files for each affected package.
3. Regenerate lock files (package-lock.json, pnpm-lock.yaml) for each updated package.
4. Commit all updated package.json and lock files together with a summary of changes.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: pnpm-lock.yaml, */package.json, */package-lock.json

